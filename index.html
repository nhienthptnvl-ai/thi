<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thầy Nhiên Nguyễn Huệ</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
    body{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px}
    .card{background:#fff;border-radius:24px;padding:30px;max-width:500px;margin:30px auto;box-shadow:0 15px 45px rgba(0,0,0,.15)}
    h1{text-align:center;color:#667eea;font-size:24px;margin-bottom:8px}
    .slogan{text-align:center;color:#888;font-style:italic;margin-bottom:20px}
    .an{display:none!important}
    input{width:100%;padding:13px;border:2px solid #eee;border-radius:12px;font-size:16px;margin:8px 0}
    button{width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer}
    .btn-xanh{background:#27ae60;color:#fff;margin-top:10px}
    .btn-tim{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;margin-top:8px}
    .btn-cam{background:#f5a623;color:#fff;margin-top:20px}
    .cau{padding:15px;background:#f9f9f9;border-radius:12px;margin:15px 0}
    .lua-chon{display:block;padding:10px;margin:6px 0;border:2px solid #ddd;border-radius:8px;cursor:pointer}
    .lua-chon.chon{border-color:#667eea;background:#eef2ff}
    .kq{margin-top:20px;padding:20px;border-radius:12px;text-align:center}
    .dung{background:#e8f8e8;color:#27ae60}
    .sai{background:#ffe8e8;color:#e74c3c}
  </style>
</head>
<body>
<div class="card">
  <h1>📚 Thầy Nhiên Nguyễn Huệ</h1>
  <p class="slogan">"Nỗ lực hôm nay — Thành công ngày mai"</p>

  <!-- MÀN HÌNH BẮT ĐẦU -->
  <div id="man-dau">
    <input type="text" id="ten" placeholder="Họ và tên học sinh">
    <input type="text" id="lop" placeholder="Lớp">
    <input type="text" id="ma" placeholder="Mã đề: DE001" oninput="this.value=this.value.toUpperCase()">
    <button class="btn-tim" onclick="batDau()">Bắt đầu làm bài</button>
    <p style="text-align:center;margin-top:10px;color:#888">💡 Thử mã: <b>DE001</b></p>
  </div>

  <!-- MÀN HÌNH LÀM BÀI -->
  <div id="man-lam" class="an">
    <h3 id="ten-de"></h3>
    <p id="thong-tin" style="color:#666;margin-bottom:15px"></p>
    <div id="danh-cau"></div>
    <button class="btn-cam" onclick="nopBai()">📤 Nộp bài & Xem điểm</button>
  </div>

  <!-- MÀN HÌNH KẾT QUẢ -->
  <div id="man-kq" class="an">
    <div id="noi-dung-kq"></div>
    <button class="btn-tim" onclick="lamLai()">🔄 Làm lại</button>
  </div>
</div>

<script>
// ========== DANH SÁCH ĐỀ ==========
const DE = {
  "DE001": {
    ten: "Đề kiểm tra mẫu",
    cau: [
      {q: "15 + 9 = ?", a:["22","23","24","25"], d:3},
      {q: "Thủ đô Việt Nam?", a:["TP.HCM","Hà Nội","Đà Nẵng","Huế"], d:2},
      {q: "Ngày 1/5 là ngày gì?", a:["Tết Nguyên Đán","Ngày Quốc tế Phụ nữ","Ngày Quốc tế Lao động","Ngày Nhà giáo Việt Nam"], d:3}
    ]
  }
};

let hs = {ten:"", lop:"", ma:""};
let traLoi = {};

function batDau(){
  hs.ten = document.getElementById("ten").value.trim();
  hs.lop = document.getElementById("lop").value.trim();
  hs.ma = document.getElementById("ma").value.trim();

  if(!hs.ten || !hs.lop) return alert("Nhập Họ tên + Lớp");
  if(!hs.ma) return alert("Nhập mã đề");
  if(!DE[hs.ma]) return alert("Mã đề không tồn tại\n💡 Thử: DE001");

  // Ẩn màn hình đầu → hiện bài làm
  document.getElementById("man-dau").classList.add("an");
  document.getElementById("man-lam").classList.remove("an");
  document.getElementById("ten-de").innerText = DE[hs.ma].ten;
  document.getElementById("thong-tin").innerText = `${hs.ten} — Lớp ${hs.lop}`;
  
  // Vẽ các câu hỏi
  let html = "";
  DE[hs.ma].cau.forEach((cau, i)=>{
    html += `<div class="cau"><p><b>Câu ${i+1}:</b> ${cau.q}</p>`;
    cau.a.forEach((ans, j)=>{
      let c = String.fromCharCode(65+j);
      html += `<label class="lua-chon" id="chon-${i+1}-${j}" onclick="chon(${i+1},${j})">${c}. ${ans}</label>`;
    });
    html += `</div>`;
  });
  document.getElementById("danh-cau").innerHTML = html;
}

function chon(cau, vt){
  traLoi[cau] = vt;
  for(let i=0;i<4;i++) document.getElementById(`chon-${cau}-${i}`)?.classList.remove("chon");
  document.getElementById(`chon-${cau}-${vt}`).classList.add("chon");
}

function nopBai(){
  let d = 0, t = DE[hs.ma].cau.length, chiTiet = "";
  for(let i=0;i<t;i++){
    let cau = DE[hs.ma].cau[i], traloi = traLoi[i+1];
    let dung = traloi === cau.d;
    if(dung) d++;
    let chon = traloi!==undefined ? String.fromCharCode(65+traloi) : "Chưa chọn";
    let dungsai = String.fromCharCode(65+cau.d);
    chiTiet += `<p style="margin:4px 0">Câu ${i+1}: ${dung?"✅ Đúng":"❌ Sai"} — Bạn ${chon} | Đáp án ${dungsai}</p>`;
  }
  let diem = Math.round((d/t)*10*10)/10;
  let xep = diem>=8?"Xuất sắc":diem>=6.5?"Khá":diem>=5?"Trung bình":"Chưa đạt";
  let mau = diem>=5?"dung":"sai";

  document.getElementById("man-lam").classList.add("an");
  document.getElementById("man-kq").classList.remove("an");
  document.getElementById("noi-dung-kq").innerHTML = `
    <div class="kq ${mau}">
      <h3>🎉 Kết quả</h3>
      <p><strong>${hs.ten}</strong> — ${hs.lop}</p>
      <p style="font-size:36px;font-weight:bold;margin:10px 0">${diem}/10</p>
      <p style="font-size:18px">${xep}</p>
      <p>Đúng ${d}/${t} câu</p>
      <hr style="margin:15px 0;border:0;border-top:1px solid #ddd">
      ${chiTiet}
    </div>
  `;
}

function lamLai(){
  document.getElementById("man-kq").classList.add("an");
  document.getElementById("man-dau").classList.remove("an");
  document.getElementById("ten").value = "";
  document.getElementById("lop").value = "";
  document.getElementById("ma").value = "";
  traLoi = {};
}

window.onload = ()=>{
  let m = new URLSearchParams(location.search).get("m");
  if(m) document.getElementById("ma").value = m.toUpperCase();
};
</script>
</body>
</html>
