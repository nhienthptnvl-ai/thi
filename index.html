<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thầy Nhiên Nguyễn Huệ</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px}
    .card{background:#fff;border-radius:24px;padding:30px;max-width:500px;margin:20px auto}
    h1{text-align:center;color:#667eea;margin-bottom:5px}
    .slogan{text-align:center;color:#888;font-style:italic;margin-bottom:20px}
    .an{display:none!important}
    input{width:100%;padding:12px;border:2px solid #eee;border-radius:10px;font-size:16px;margin:8px 0}
    button{width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;margin:6px 0}
    .btn-tim{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff}
    .btn-xanh{background:#27ae60;color:#fff}
    .btn-cam{background:#f5a623;color:#fff}
    .btn-do{background:#e74c3c;color:#fff}
    .tab{display:flex;gap:8px;margin-bottom:15px}
    .tab button{flex:1;background:#eee;color:#333}
    .tab button.active{background:#667eea;color:#fff}
    .cau{padding:15px;background:#f9f9f9;border-radius:10px;margin:10px 0}
    .lua-chon{display:block;padding:10px;margin:6px 0;border:2px solid #ddd;border-radius:8px;cursor:pointer}
    .lua-chon.chon{border-color:#667eea;background:#eef2ff}
    .kq{margin-top:20px;padding:20px;border-radius:12px;text-align:center}
    .dung{background:#e8f8e8;color:#27ae60}
    .sai{background:#ffe8e8;color:#e74c3c}
    .de-item{padding:10px 0;border-bottom:1px solid #eee}
  </style>
</head>
<body>
<div class="card">
  <h1>📚 Thầy Nhiên Nguyễn Huệ</h1>
  <p class="slogan">"Nỗ lực hôm nay — Thành công ngày mai"</p>

  <!-- MÀN HÌNH CHỌN -->
  <div id="man-chon">
    <button class="btn-tim" onclick="moGiaoVien()">👨‍🏫 Tôi là Giáo viên</button>
    <p style="text-align:center;margin:15px 0;color:#bbb">——— Hoặc ———</p>
    <button class="btn-xanh" onclick="moHocSinh()">🎓 Tôi là Học sinh</button>
  </div>

  <!-- GIÁO VIÊN -->
  <div id="man-gv" class="an">
    <div class="tab">
      <button id="tab-ds" class="active" onclick="tab('ds')">📋 Danh sách đề</button>
      <button id="tab-tao" onclick="tab('tao')">✏️ Tạo đề</button>
    </div>

    <div id="gv-ds">
      <h3>Danh sách đề</h3>
      <div id="danhsach"></div>
    </div>

    <div id="gv-tao" class="an">
      <h3>Tạo đề mới</h3>
      <input type="text" id="ten-de" placeholder="Tên đề">
      <input type="text" id="ma-de" placeholder="Mã đề (VD: DE002)">
      <div id="cau-tao">
        <div class="cau">
          <strong>Câu 1</strong>
          <input type="text" class="nd" placeholder="Nội dung câu hỏi">
          <input type="text" class="a" placeholder="Đáp án A">
          <input type="text" class="b" placeholder="Đáp án B">
          <input type="text" class="c" placeholder="Đáp án C">
          <input type="text" class="d" placeholder="Đáp án D">
          <input type="number" class="dung" placeholder="Đáp án đúng: 1=A, 2=B, 3=C, 4=D" min="1" max="4">
        </div>
      </div>
      <button class="btn-cam" onclick="themCau()">➕ Thêm câu</button>
      <button class="btn-xanh" onclick="luuDe()">✅ Lưu & Tạo link</button>
      <p id="link-kq" style="margin-top:12px;word-break:break-all"></p>
    </div>

    <button class="btn-do" onclick="veDau()" style="margin-top:20px">🔙 Quay lại</button>
  </div>

  <!-- HỌC SINH -->
  <div id="man-hs" class="an">
    <input type="text" id="ten-hs" placeholder="Họ và tên">
    <input type="text" id="lop-hs" placeholder="Lớp">
    <input type="text" id="ma-nhap" placeholder="Mã đề" oninput="this.value=this.value.toUpperCase()">
    <button class="btn-tim" onclick="batDau()">🔍 Bắt đầu làm bài</button>
    <p id="tb" style="margin-top:10px;text-align:center"></p>

    <div id="bai-lam" class="an">
      <h3 id="ten-de-hs"></h3>
      <p id="tt-hs" style="color:#666;margin-bottom:15px"></p>
      <div id="danh-cau"></div>
      <button class="btn-cam" onclick="nopBai()">📤 Nộp bài & Xem điểm</button>
    </div>

    <div id="ket-qua" class="an">
      <div id="noi-dung-kq"></div>
      <button class="btn-tim" onclick="lamLai()">🔄 Làm lại</button>
    </div>

    <button class="btn-do" onclick="veDau()" style="margin-top:20px">🔙 Quay lại</button>
  </div>
</div>

<script>
// DỮ LIỆU
let DE = {
  "DEMO": {
    ten: "Đề thử nghiệm",
    cau: [
      {q: "15 + 9 = ?", a:["22","23","24","25"], d:3},
      {q: "Thủ đô Việt Nam?", a:["TP.HCM","Hà Nội","Đà Nẵng","Huế"], d:2}
    ]
  }
};

let deChon = null;
let dapAn = {};
let ttHS = {ten:"", lop:""};
let soCau = 1;

// CHUYỂN MÀN HÌNH
function moGiaoVien(){
  document.getElementById("man-chon").classList.add("an");
  document.getElementById("man-gv").classList.remove("an");
  hienDS();
}
function moHocSinh(){
  document.getElementById("man-chon").classList.add("an");
  document.getElementById("man-hs").classList.remove("an");
}
function veDau(){
  location.reload();
}
function tab(t){
  document.getElementById("gv-ds").classList.toggle("an",t!=="ds");
  document.getElementById("gv-tao").classList.toggle("an",t!=="tao");
  document.getElementById("tab-ds").classList.toggle("active",t==="ds");
  document.getElementById("tab-tao").classList.toggle("active",t==="tao");
  if(t==="ds") hienDS();
}

// GIÁO VIÊN
function hienDS(){
  let html = "";
  for(let m in DE){
    html += `<div class="de-item"><strong>${m}</strong> — ${DE[m].ten} (${DE[m].cau.length} câu)<br>Link: ${location.origin}${location.pathname}?m=${m}</div>`;
  }
  document.getElementById("danhsach").innerHTML = html || "<p style='color:#888'>Chưa có đề</p>";
}
function themCau(){
  soCau++;
  const k = document.getElementById("cau-tao");
  k.innerHTML += `<div class="cau"><strong>Câu ${soCau}</strong><input type="text" class="nd" placeholder="Nội dung"><input type="text" class="a" placeholder="A"><input type="text" class="b" placeholder="B"><input type="text" class="c" placeholder="C"><input type="text" class="d" placeholder="D"><input type="number" class="dung" placeholder="Đáp án đúng 1-4" min="1" max="4"></div>`;
}
function luuDe(){
  const ma = document.getElementById("ma-de").value.trim().toUpperCase();
  const ten = document.getElementById("ten-de").value.trim();
  if(!ma || !ten) return alert("Nhập mã + tên đề");
  if(DE[ma]) return alert("Mã đã tồn tại");
  
  const dsCau = [];
  document.querySelectorAll("#cau-tao .cau").forEach(d=>{
    const q = d.querySelector(".nd").value.trim();
    const a = d.querySelector(".a").value.trim();
    const b = d.querySelector(".b").value.trim();
    const c = d.querySelector(".c").value.trim();
    const d_ = d.querySelector(".d").value.trim();
    const dung = parseInt(d.querySelector(".dung").value);
    if(q&&a&&b&&c&&d_&&dung) dsCau.push({q,a:[a,b,c,d_],d:dung});
  });
  if(!dsCau.length) return alert("Điền đủ thông tin câu hỏi");
  
  DE[ma] = {ten,cau:dsCau};
  const link = `${location.origin}${location.pathname}?m=${ma}`;
  document.getElementById("link-kq").innerHTML = `✅ Đã lưu!<br><strong>Link:</strong> ${link}`;
  alert("✅ Lưu thành công!");
}

// HỌC SINH
function batDau(){
  const ten = document.getElementById("ten-hs").value.trim();
  const lop = document.getElementById("lop-hs").value.trim();
  const ma = document.getElementById("ma-nhap").value.trim();
  const tb = document.getElementById("tb");
  
  if(!ten||!lop) return tb.innerHTML = "<span style='color:red'>⚠️ Nhập họ tên + lớp</span>";
  if(!ma) return tb.innerHTML = "<span style='color:red'>⚠️ Nhập mã đề</span>";
  if(!DE[ma]) return tb.innerHTML = "<span style='color:red'>❌ Mã đề không tồn tại<br>💡 Thử: DEMO</span>";
  
  ttHS = {ten,lop};
  deChon = DE[ma];
  dapAn = {};
  
  document.getElementById("bai-lam").classList.remove("an");
  document.getElementById("ket-qua").classList.add("an");
  document.getElementById("ten-de-hs").innerText = deChon.ten;
  document.getElementById("tt-hs").innerText = `${ten} — Lớp ${lop}`;
  
  let html = "";
  deChon.cau.forEach((c,i)=>{
    html += `<div class="cau"><p><b>Câu ${i+1}:</b> ${c.q}</p>`;
    c.a.forEach((ans,j)=>{
      let ch = String.fromCharCode(65+j);
      html += `<label class="lua-chon" id="chon-${i+1}-${j}" onclick="chon(${i+1},${j})">${ch}. ${ans}</label>`;
    });
    html += `</div>`;
  });
  document.getElementById("danh-cau").innerHTML = html;
  tb.innerHTML = "<span style='color:green'>✅ Sẵn sàng làm bài</span>";
}
function chon(cau,vt){
  dapAn[cau] = vt;
  for(let i=0;i<4;i++) document.getElementById(`chon-${cau}-${i}`)?.classList.remove("chon");
  document.getElementById(`chon-${cau}-${vt}`).classList.add("chon");
}
function nopBai(){
  if(!deChon) return;
  let d=0, t=deChon.cau.length, ct="";
  for(let i=0;i<t;i++){
    let c = deChon.cau[i], traloi = dapAn[i+1];
    let dung = traloi === c.d;
    if(dung) d++;
    let chon = traloi!==undefined ? String.fromCharCode(65+traloi) : "Chưa chọn";
    let dungsai = String.fromCharCode(65+c.d);
    ct += `<p style="margin:4px 0">Câu ${i+1}: ${dung?"✅ Đúng":"❌ Sai"} — Bạn ${chon} | Đáp án ${dungsai}</p>`;
  }
  let diem = Math.round((d/t)*10*10)/10;
  let xep = diem>=8?"Xuất sắc":diem>=6.5?"Khá":diem>=5?"Trung bình":"Chưa đạt";
  let mau = diem>=5?"dung":"sai";
  
  document.getElementById("bai-lam").classList.add("an");
  document.getElementById("ket-qua").classList.remove("an");
  document.getElementById("noi-dung-kq").innerHTML = `
    <div class="kq ${mau}">
      <h3>🎉 Kết quả</h3>
      <p><strong>${ttHS.ten}</strong> — ${ttHS.lop}</p>
      <p style="font-size:36px;font-weight:bold;margin:10px 0">${diem}/10</p>
      <p style="font-size:18px">${xep}</p>
      <p>Đúng ${d}/${t} câu</p>
      <hr style="margin:15px 0;border:0;border-top:1px solid #ddd">
      ${ct}
    </div>
  `;
}
function lamLai(){
  document.getElementById("ket-qua").classList.add("an");
  document.getElementById("ma-nhap").value = "";
  document.getElementById("tb").innerHTML = "";
  deChon = null; dapAn = {};
}

// Tự điền mã từ link
window.onload = ()=>{
  let m = new URLSearchParams(location.search).get("m");
  if(m) document.getElementById("ma-nhap").value = m.toUpperCase();
};
</script>
</body>
</html>
