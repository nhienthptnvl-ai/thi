<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thầy Nhiên Nguyễn Huệ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
    .card { background: white; border-radius: 24px; padding: 35px; max-width: 460px; margin: 40px auto; box-shadow: 0 15px 45px rgba(0,0,0,0.15); }
    h1 { text-align: center; color: #667eea; font-size: 26px; margin-bottom: 8px; }
    .slogan { text-align: center; color: #888; font-style: italic; margin-bottom: 25px; }
    .trangthai { padding: 14px; border-radius: 12px; margin-bottom: 20px; text-align: center; font-weight: 500; }
    .dang { background: #e6f2ff; color: #0066cc; border-left: 4px solid #0066cc; }
    .tot { background: #e8f8e8; color: #27ae60; border-left: 4px solid #27ae60; }
    .sai { background: #fff3cd; color: #856404; border-left: 4px solid #f5a623; }
    input { width: 100%; padding: 14px; border: 2px solid #e8e8e8; border-radius: 12px; font-size: 16px; margin: 8px 0 16px; }
    button { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
    button:hover { opacity: 0.92; }
    .btn-chinh { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; margin-top: 8px; }
    .btn-xanh { background: #27ae60; color: white; margin-top: 10px; }
    .an { display: none !important; }
    .phancach { text-align: center; color: #bbb; margin: 24px 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📚 Thầy Nhiên Nguyễn Huệ</h1>
    <p class="slogan">"Nỗ lực hôm nay — Thành công ngày mai"</p>

    <div id="trangthai" class="trangthai dang">✅ Sẵn sàng — Nhập mã đề</div>
    <button id="btn-giaovien" class="btn-chinh an" onclick="vaoGiaoVien()">👨‍🏫 Tôi là Giáo viên</button>
    
    <p class="phancach">——— Nhập mã đề để làm bài ———</p>
    <input type="text" id="ma_de" placeholder="VD: DEMO" oninput="this.value=this.value.toUpperCase()">
    <button class="btn-chinh" onclick="kiemTraMa()">🔍 Kiểm tra mã đề</button>
    <div id="thongbao" style="margin-top:12px;"></div>
    <button id="vao-lambai" class="btn-xanh an" onclick="vaoLamBai()">✅ Vào làm bài ngay</button>
  </div>

  <script>
    // ========== DANH SÁCH ĐỀ (LƯU TRỰC TIẾP) ==========
    const DANH_SACH_DE = {
      "DEMO": {
        ten_de: "Đề thử nghiệm",
        cau_hoi: [
          {
            noi_dung: "Câu 1: 2 + 3 = ?",
            lua_chon: ["3", "4", "5", "6"],
            dap_an_dung: 2
          },
          {
            noi_dung: "Câu 2: Thủ đô của Việt Nam là?",
            lua_chon: ["TP.HCM", "Hà Nội", "Đà Nẵng", "Huế"],
            dap_an_dung: 2
          }
        ]
      }
      // Thêm đề khác tại đây: "MA_DE": { ten_de: "...", cau_hoi: [...] }
    };

    let deChon = null;

    function kiemTraMa() {
      const ma = document.getElementById('ma_de').value.trim();
      const tb = document.getElementById('thongbao');
      const btn = document.getElementById('vao-lambai');
      const tt = document.getElementById('trangthai');
      
      tb.innerHTML = '';
      btn.classList.add('an');
      deChon = null;

      if (!ma) {
        tb.innerHTML = '<p style="color:#e74c3c">⚠️ Vui lòng nhập mã đề</p>';
        return;
      }

      if (DANH_SACH_DE[ma]) {
        deChon = DANH_SACH_DE[ma];
        tt.className = 'trangthai tot';
        tt.innerHTML = `✅ Đã tìm thấy: ${deChon.ten_de}`;
        tb.innerHTML = `<p style="color:#27ae60">✅ ${deChon.ten_de} — ${deChon.cau_hoi.length} câu</p>`;
        btn.classList.remove('an');
        document.getElementById('btn-giaovien').classList.remove('an');
      } else {
        tt.className = 'trangthai sai';
        tt.innerHTML = '❌ Mã đề không tồn tại';
        tb.innerHTML = `<p style="color:#e74c3c">❌ Mã đề <strong>${ma}</strong> không tồn tại</p>
          <p style="color:#f5a623; margin-top:8px;">💡 Thử gõ: <strong>DEMO</strong></p>`;
      }
    }

    function vaoLamBai() {
      if (!deChon) {
        alert('⚠️ Kiểm tra mã đề trước!');
        return;
      }
      alert(`✅ Vào làm bài: ${deChon.ten_de}\nCó ${deChon.cau_hoi.length} câu`);
    }

    function vaoGiaoVien() {
      alert('✅ Giao diện Giáo viên — Tạo đề & Quản lý điểm');
    }

    // Tự điền mã nếu có trong link ?m=DEMO
    window.onload = function() {
      const m = new URLSearchParams(window.location.search).get('m');
      if (m) {
        document.getElementById('ma_de').value = m.toUpperCase();
        kiemTraMa();
      }
    };
  </script>
</body>
</html>
