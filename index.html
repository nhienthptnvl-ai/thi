<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thầy Nhiên Nguyễn Huệ</title>
  <!-- Đảm bảo link hoạt động trên mọi thiết bị -->
  <base target="_self">
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
    body{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px}
    .khung{background:#fff;border-radius:24px;padding:30px;max-width:520px;margin:20px auto;box-shadow:0 15px 45px rgba(0,0,0,.15)}
    h1{text-align:center;color:#667eea;font-size:22px;margin-bottom:5px}
    .slogan{text-align:center;color:#888;font-style:italic;margin-bottom:20px}
    .an{display:none!important}
    input{width:100%;padding:14px;border:2px solid #eee;border-radius:12px;font-size:16px;margin:8px 0}
    button{width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;margin:6px 0}
    .btn-tim{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff}
    .btn-xanh{background:#27ae60;color:#fff}
    .btn-cam{background:#f5a623;color:#fff}
    .btn-do{background:#e74c3c;color:#fff}
    .btn-xam{background:#eee;color:#333}
    .tab{display:flex;gap:8px;margin-bottom:15px}
    .tab button{flex:1}
    .tab button.dang{background:#667eea;color:#fff}
    .tab button.bin{background:#eee;color:#333}
    .cau{padding:15px;background:#f9f9f9;border-radius:12px;margin:10px 0}
    .lua-chon{display:block;padding:12px;margin:6px 0;border:2px solid #ddd;border-radius:8px;cursor:pointer}
    .lua-chon.chon{border-color:#667eea;background:#eef2ff}
    .kq{margin-top:20px;padding:25px;border-radius:12px;text-align:center}
    .dung{background:#e8f8e8;color:#27ae60}
    .sai{background:#ffe8e8;color:#e74c3c}
    .link-kq{background:#f0f4ff;padding:12px;border-radius:8px;font-family:monospace;word-break:break-all;margin:10px 0;font-size:13px}
    #qr-code{text-align:center;margin:15px 0}
    .thong-bao{padding:10px;border-radius:8px;margin:10px 0;text-align:center}
    .thanhcong{background:#e8f8e8;color:#27ae60}
    .loi{background:#ffe8e8;color:#e74c3c}
    .canhbao{background:#fff3cd;color:#856404}
    .huong-dan{background:#f8f9fa;padding:15px;border-radius:10px;margin:15px 0;font-size:14px;line-height:1.6}
  </style>
</head>
<body>
<div class="khung">
  <h1>📚 Thầy Nhiên Nguyễn Huệ</h1>
  <p class="slogan">"Nỗ lực hôm nay — Thành công ngày mai"</p>

  <!-- MÀN HÌNH CHỌN -->
  <div id="man-chon">
    <button class="btn-tim" onclick="moGiaoVien()">👨‍🏫 Tôi là Giáo viên</button>
    <p style="text-align:center;margin:20px 0;color:#bbb">—————— hoặc ——————</p>
    <button class="btn-xanh" onclick="moHocSinh()">🎓 Tôi là Học sinh</button>
  </div>

  <!-- GIAO DIỆN GIÁO VIÊN -->
  <div id="man-gv" class="an">
    <div class="tab">
      <button id="tab-ds" class="dang" onclick="chuyenTab('ds')">📋 Danh sách đề</button>
      <button id="tab-tao" class="bin" onclick="chuyenTab('tao')">✏️ Tạo đề</button>
    </div>

    <div id="gv-ds">
      <h3>Danh sách đề</h3>
      <div id="danhsach-de"></div>
    </div>

    <div id="gv-tao" class="an">
      <h3>Tạo đề mới</h3>
      <input type="text" id="ten-de" placeholder="Tên đề: Kiểm tra Toán">
      <input type="text" id="ma-de" placeholder="Mã đề: TOAN01 (tự tạo)">
      
      <div id="danh-cau">
        <div class="cau">
          <strong>Câu 1</strong>
          <input type="text" class="nd" placeholder="Nội dung câu hỏi">
          <input type="text" class="a" placeholder="Đáp án A">
          <input type="text" class="b" placeholder="Đáp án B">
          <input type="text" class="c" placeholder="Đáp án C">
          <input type="text" class="d" placeholder="Đáp án D">
          <input type="number" class="dung" placeholder="Đáp án đúng: 1=A, 2=B, 3=C, 4=D" min="1" max="4">
        </div>
      </div>
      
      <button class="btn-cam" onclick="themCau()">➕ Thêm câu</button>
      <button class="btn-xanh" onclick="luuDe()">✅ Lưu & Tạo link</button>
      
      <div id="kq-tao" class="an">
        <div class="thong-bao thanhcong">✅ Tạo đề thành công!</div>
        
        <div class="huong-dan">
          <p><strong>📤 Cách gửi cho học sinh:</strong></p>
          <p><strong>Cách 1 — Gõ tay nhanh:</strong> Mở trang web → nhập mã: <span id="ma-gui" style="font-weight:bold;color:#e74c3c"></span></p>
          <p><strong>Cách 2 — Nhấn link:</strong></p>
        </div>
        
        <div class="link-kq" id="link-gui"></div>
        <button class="btn-tim" onclick="saoChepLink()">📋 Sao chép link gửi Zalo/Facebook</button>
        
        <p style="margin:15px 0 5px 0;font-weight:bold">📱 Quét mã QR:</p>
        <div id="qr-code"></div>
        <button class="btn-cam" onclick="taiQR()" style="margin-top:5px">💾 Lưu ảnh QR gửi học sinh</button>
      </div>
    </div>

    <button class="btn-xam" onclick="quayLai()">🔙 Quay lại</button>
  </div>

  <!-- GIAO DIỆN HỌC SINH -->
  <div id="man-hs" class="an">
    <div id="thong-bao-hs" class="thong-bao canhbao">
      💡 Nhập thông tin → nhập mã đề → nhấn Bắt đầu
    </div>
    
    <input type="text" id="ten-hs" placeholder="Họ và tên (VD: Nguyễn Văn An)">
    <input type="text" id="lop-hs" placeholder="Lớp (VD: 5A)">
    <input type="text" id="ma-nhap" placeholder="Mã đề" oninput="this.value=this.value.toUpperCase().trim()">
    
    <button class="btn-tim" onclick="batDau()">🚀 Bắt đầu làm bài</button>

    <!-- BÀI LÀM -->
    <div id="phan-lam" class="an">
      <h3 id="ten-de-hs"></h3>
      <p id="tt-hs" style="color:#666;margin:10px 0"></p>
      <div id="cac-cau"></div>
      <button class="btn-cam" onclick="nopBai()">📤 Nộp bài & Xem điểm</button>
    </div>

    <!-- KẾT QUẢ -->
    <div id="phan-kq" class="an">
      <div id="noi-dung-kq"></div>
      <button class="btn-tim" onclick="lamLai()">🔄 Làm bài khác</button>
    </div>

    <button class="btn-xam" onclick="quayLai()">🔙 Quay lại</button>
  </div>
</div>

<script>
// ========== DỮ LIỆU — LƯU TRÊN TRÌNH DUYỆT ==========
let DANH_DE = {};
const KHOA_DL = 'dulieu_de_thi';

function taiDuLieu(){
  const luu = localStorage.getItem(KHOA_DL);
  if(luu) try{ DANH_DE = JSON.parse(luu); }catch(e){ DANH_DE = {}; }
}
function luuDuLieu(){
  localStorage.setItem(KHOA_DL, JSON.stringify(DANH_DE));
}

// ========== CHUYỂN MÀN HÌNH ==========
function moGiaoVien(){
  taiDuLieu();
  document.getElementById("man-chon").classList.add("an");
  document.getElementById("man-gv").classList.remove("an");
  hienDS();
}
function moHocSinh(){
  taiDuLieu();
  document.getElementById("man-chon").classList.add("an");
  document.getElementById("man-hs").classList.remove("an");
}
function quayLai(){
  location.search = ''; // Xóa mã trên thanh địa chỉ
  location.reload();
}
function chuyenTab(tab){
  document.getElementById("gv-ds").classList.toggle("an", tab!=="ds");
  document.getElementById("gv-tao").classList.toggle("an", tab!=="tao");
  document.getElementById("tab-ds").classList.toggle("dang", tab==="ds");
  document.getElementById("tab-ds").classList.toggle("bin", tab!=="ds");
  document.getElementById("tab-tao").classList.toggle("dang", tab==="tao");
  document.getElementById("tab-tao").classList.toggle("bin", tab!=="tao");
  if(tab==="ds") hienDS();
}

// ========== GIÁO VIÊN TẠO ĐỀ ==========
function hienDS(){
  let html = "";
  for(let ma in DANH_DE){
    html += `<div style="padding:10px 0;border-bottom:1px solid #eee">
      <strong>${ma}</strong> — ${DANH_DE[ma].ten} (${DANH_DE[ma].cau.length} câu)<br>
      <small style="color:#666">Gửi: ${layLink(ma)}</small>
    </div>`;
  }
  document.getElementById("danhsach-de").innerHTML = html || "<p style='color:#888;text-align:center;padding:20px'>Chưa có đề nào → Tạo đề mới</p>";
}

function layLink(ma){
  // Link NGẮN NHẤT có thể
  const goc = window.location.origin + window.location.pathname;
  return goc + "?m=" + ma;
}

function themCau(){
  const khung = document.getElementById("danh-cau");
  const soCau = khung.children.length + 1;
  khung.innerHTML += `
    <div class="cau">
      <strong>Câu ${soCau}</strong>
      <input type="text" class="nd" placeholder="Nội dung câu hỏi">
      <input type="text" class="a" placeholder="Đáp án A">
      <input type="text" class="b" placeholder="Đáp án B">
      <input type="text" class="c" placeholder="Đáp án C">
      <input type="text" class="d" placeholder="Đáp án D">
      <input type="number" class="dung" placeholder="Đáp án đúng: 1-4" min="1" max="4">
    </div>
  `;
}

function luuDe(){
  const ma = document.getElementById("ma-de").value.trim().toUpperCase();
  const ten = document.getElementById("ten-de").value.trim();
  
  if(!ma || !ten) return alert("⚠️ Nhập mã đề + tên đề");
  if(DANH_DE[ma] && !confirm(`Mã ${ma} đã có → Ghi đè?`)) return;
  
  const dsCau = [];
  document.querySelectorAll("#danh-cau .cau").forEach(d=>{
    const q = d.querySelector(".nd").value.trim();
    const a = d.querySelector(".a").value.trim();
    const b = d.querySelector(".b").value.trim();
    const c = d.querySelector(".c").value.trim();
    const d_ = d.querySelector(".d").value.trim();
    const dung = parseInt(d.querySelector(".dung").value);
    if(q && a && b && c && d_ && !isNaN(dung)){
      dsCau.push({q, a:[a,b,c,d_], d:dung});
    }
  });
  
  if(!dsCau.length) return alert("⚠️ Điền đầy đủ thông tin ít nhất 1 câu");
  
  DANH_DE[ma] = {ten, cau: dsCau};
  luuDuLieu();
  
  // Hiện link + QR
  const link = layLink(ma);
  document.getElementById("ma-gui").innerText = ma;
  document.getElementById("link-gui").innerText = link;
  document.getElementById("kq-tao").classList.remove("an");
  
  // Tạo QR
  const khungQR = document.getElementById("qr-code");
  khungQR.innerHTML = "";
  QRCode.toCanvas(document.createElement('canvas'), link, {width:180, margin:2}, function(err, canvas){
    if(!err) khungQR.appendChild(canvas);
  });
  
  // Reset form
  document.getElementById("ma-de").value = "";
  document.getElementById("ten-de").value = "";
  document.getElementById("danh-cau").innerHTML = `
    <div class="cau">
      <strong>Câu 1</strong>
      <input type="text" class="nd" placeholder="Nội dung câu hỏi">
      <input type="text" class="a" placeholder="Đáp án A">
      <input type="text" class="b" placeholder="Đáp án B">
      <input type="text" class="c" placeholder="Đáp án C">
      <input type="text" class="d" placeholder="Đáp án D">
      <input type="number" class="dung" placeholder="Đáp án đúng: 1-4" min="1" max="4">
    </div>
  `;
}

function saoChepLink(){
  const link = document.getElementById("link-gui").innerText;
  navigator.clipboard.writeText(link).then(()=>{
    alert("✅ Đã sao chép → Dán vào Zalo/Facebook gửi học sinh");
  }).catch(()=>{
    prompt("📋 Sao chép thủ công:", link);
  });
}

function taiQR(){
  const canvas = document.querySelector("#qr-code canvas");
  if(!canvas) return;
  const link = document.createElement('a');
  link.download = 'MA_QR_DE.png';
  link.href = canvas.toDataURL();
  link.click();
}

// ========== HỌC SINH LÀM BÀI ==========
let DE_DANG = null;
let DAP_AN = {};
let TT = {ten:"", lop:""};

function batDau(){
  const ten = document.getElementById("ten-hs").value.trim();
  const lop = document.getElementById("lop-hs").value.trim();
  const ma = document.getElementById("ma-nhap").value.trim();
  const tb = document.getElementById("thong-bao-hs");
  
  if(!ten || !lop){
    tb.className = "thong-bao loi";
    tb.innerHTML = "⚠️ Nhập họ tên + lớp trước";
    return;
  }
  if(!ma){
    tb.className = "thong-bao loi";
    tb.innerHTML = "⚠️ Nhập mã đề";
    return;
  }
  if(!DANH_DE[ma]){
    tb.className = "thong-bao loi";
    tb.innerHTML = `❌ Mã <strong>${ma}</strong> không tồn tại<br>💡 Kiểm tra lại chữ viết hoa/thường hoặc nhấn link giáo viên gửi`;
    return;
  }
  
  // Vào bài làm
  TT = {ten, lop};
  DE_DANG = DANH_DE[ma];
  DAP_AN = {};
  
  tb.className = "thong-bao thanhcong";
  tb.innerHTML = `✅ Đã tìm thấy: <strong>${DE_DANG.ten}</strong> — ${DE_DANG.cau.length} câu`;
  
  document.getElementById("phan-lam").classList.remove("an");
  document.getElementById("phan-kq").classList.add("an");
  document.getElementById("ten-de-hs").innerText = DE_DANG.ten;
  document.getElementById("tt-hs").innerText = `${ten} — Lớp ${lop}`;
  
  let html = "";
  DE_DANG.cau.forEach((c, i)=>{
    html += `<div class="cau"><p><b>Câu ${i+1}:</b> ${c.q}</p>`;
    c.a.forEach((dap, j)=>{
      let chu = String.fromCharCode(65 + j);
      html += `<label class="lua-chon" id="chon-${i+1}-${j}" onclick="chon(${i+1},${j})">${chu}. ${dap}</label>`;
    });
    html += `</div>`;
  });
  document.getElementById("cac-cau").innerHTML = html;
}

function chon(cau, vt){
  DAP_AN[cau] = vt;
  for(let i=0;i<4;i++) document.getElementById(`chon-${cau}-${i}`)?.classList.remove("chon");
  document.getElementById(`chon-${cau}-${vt}`).classList.add("chon");
}

function nopBai(){
  if(!DE_DANG) return;
  let dung = 0, tong = DE_DANG.cau.length, chiTiet = "";
  for(let i=0;i<tong;i++){
    let c = DE_DANG.cau[i], traloi = DAP_AN[i+1];
    let d = traloi === c.d;
    if(d) dung++;
    let chon = traloi!==undefined ? String.fromCharCode(65+traloi) : "Chưa chọn";
    let dungSai = String.fromCharCode(65+c.d);
    chiTiet += `<p style="margin:4px 0">Câu ${i+1}: ${d?"✅ Đúng":"❌ Sai"} — Bạn ${chon} | Đáp án ${dungSai}</p>`;
  }
  let diem = Math.round((dung/tong)*10*10)/10;
  let xep = diem>=8?"Xuất sắc":diem>=6.5?"Khá":diem>=5?"Trung bình":"Chưa đạt";
  let mau = diem>=5?"dung":"sai";
  
  document.getElementById("phan-lam").classList.add("an");
  document.getElementById("phan-kq").classList.remove("an");
  document.getElementById("noi-dung-kq").innerHTML = `
    <div class="kq ${mau}">
      <h3>🎉 Kết quả</h3>
      <p><strong>${TT.ten}</strong> — ${TT.lop}</p>
      <p style="font-size:40px;font-weight:bold;margin:15px 0">${diem}/10</p>
      <p style="font-size:20px">${xep}</p>
      <p>Đúng ${dung}/${tong} câu</p>
      <hr style="margin:20px 0;border:0;border-top:1px solid #ddd">
      ${chiTiet}
    </div>
  `;
}

function lamLai(){
  document.getElementById("phan-kq").classList.add("an");
  document.getElementById("ma-nhap").value = "";
  DE_DANG = null; DAP_AN = {};
}

// Tự điền mã khi mở link ?m=MA_DE
window.onload = function(){
  taiDuLieu();
  const thamSo = new URLSearchParams(window.location.search);
  const ma = thamSo.get('m');
  if(ma){
    moHocSinh();
    document.getElementById("ma-nhap").value = ma.toUpperCase();
    document.getElementById("thong-bao-hs").innerHTML = `✅ Đã nhận mã từ link: <strong>${ma.toUpperCase()}</strong><br>Nhập tên + lớp → nhấn Bắt đầu`;
  }
};
</script>
</body>
</html>
