<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thầy Nhiên Nguyễn Huệ</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
    body{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px}
    .card{background:#fff;border-radius:24px;padding:30px;max-width:500px;margin:30px auto;box-shadow:0 15px 45px rgba(0,0,0,.15)}
    h1{text-align:center;color:#667eea;font-size:24px;margin-bottom:8px}
    .slogan{text-align:center;color:#888;font-style:italic;margin-bottom:20px}
    .trangthai{padding:12px;border-radius:12px;margin-bottom:15px;text-align:center;font-weight:500}
    .tot{background:#e8f8e8;color:#27ae60;border-left:4px solid #27ae60}
    .an{display:none!important}
    input{width:100%;padding:13px;border:2px solid #eee;border-radius:12px;font-size:16px;margin:8px 0}
    button{width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;transition:.2s}
    button:hover{opacity:.92}
    .btn-tim{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;margin-top:8px}
    .btn-xanh{background:#27ae60;color:#fff;margin-top:10px}
    .btn-cam{background:#f5a623;color:#fff;margin-top:20px}
    .cau{padding:15px;background:#f9f9f9;border-radius:12px;margin:15px 0}
    .lua-chon{display:block;padding:10px;margin:6px 0;border:2px solid #ddd;border-radius:8px;cursor:pointer}
    .lua-chon.chon{border-color:#667eea;background:#eef2ff}
    .kq{margin-top:20px;padding:20px;border-radius:12px;text-align:center}
    .dung{background:#e8f8e8;color:#27ae60}
    .sai{background:#ffe8e8;color:#e74c3c}
    .phancach{text-align:center;color:#bbb;margin:20px 0}
  </style>
</head>
<body>
<div class="card">
  <h1>📚 Thầy Nhiên Nguyễn Huệ</h1>
  <p class="slogan">"Nỗ lực hôm nay — Thành công ngày mai"</p>

  <!-- MÀN HÌNH BẮT ĐẦU -->
  <div id="man-dau">
    <div class="trangthai tot">✅ Sẵn sàng — Nhập thông tin</div>
    <input type="text" id="ho_ten" placeholder="Họ và tên học sinh">
    <input type="text" id="lop" placeholder="Lớp">
    <p class="phancach">——— Nhập mã đề để làm bài ———</p>
    <input type="text" id="ma_de" placeholder="VD: DEMO" oninput="this.value=this.value.toUpperCase()">
    <button class="btn-tim" onclick="kiemTraMa()">🔍 Kiểm tra mã đề</button>
    <div id="thongbao" style="margin-top:12px"></div>
    <button id="btn-vao" class="btn-xanh an" onclick="vaoLamBai()">✅ Vào làm bài ngay</button>
  </div>

  <!-- MÀN HÌNH LÀM BÀI -->
  <div id="man-lam" class="an">
    <h3 id="ten_de"></h3>
    <p id="thong_tin_hs" style="color:#666;margin-bottom:15px"></p>
    <div id="danh_sach_cau"></div>
    <button class="btn-cam" onclick="nopBai()">📤 Nộp bài & Xem điểm</button>
  </div>

  <!-- MÀN HÌNH KẾT QUẢ -->
  <div id="man-kq" class="an">
    <div id="noi_dung_kq"></div>
    <button class="btn-tim" onclick="lamLai()">🔄 Làm lại</button>
  </div>
</div>

<script>
// ========== DANH SÁCH ĐỀ ==========
const DANH_SACH_DE = {
  "DEMO": {
    ten_de: "Đề thử nghiệm",
    cau_hoi: [
      {q: "Câu 1: 15 + 9 = ?", a:["22","23","24","25"], d:3},
      {q: "Câu 2: Thủ đô Việt Nam là đâu?", a:["TP.HCM","Hà Nội","Đà Nẵng","Huế"], d:2}
    ]
  }
  // Thêm đề mới theo mẫu trên
};

let deChon = null;
let dapAnHS = {};
let thongTin = {hoten:"", lop:""};

function kiemTraMa(){
  const ma = document.getElementById("ma_de").value.trim();
  const hoten = document.getElementById("ho_ten").value.trim();
  const lop = document.getElementById("lop").value.trim();
  const tb = document.getElementById("thongbao");
  const btn = document.getElementById("btn-vao");
  
  btn.classList.add("an");
  deChon = null;

  if(!hoten || !lop){
    tb.innerHTML = '<p style="color:#e74c3c">⚠️ Nhập họ tên và lớp</p>';
    return;
  }
  if(!ma){
    tb.innerHTML = '<p style="color:#e74c3c">⚠️ Nhập mã đề</p>';
    return;
  }
  if(!DANH_SACH_DE[ma]){
    tb.innerHTML = `<p style="color:#e74c3c">❌ Mã đề ${ma} không tồn tại</p>`;
    return;
  }

  thongTin = {hoten, lop};
  deChon = DANH_SACH_DE[ma];
  tb.innerHTML = `<p style="color:#27ae60">✅ ${deChon.ten_de} — ${deChon.cau_hoi.length} câu</p>`;
  btn.classList.remove("an"); // Hiện nút Vào làm bài
}

function vaoLamBai(){
  if(!deChon) return alert("Kiểm tra mã đề trước!");
  
  // Ẩn màn hình đầu → hiện bài làm
  document.getElementById("man-dau").classList.add("an");
  document.getElementById("man-lam").classList.remove("an");
  
  document.getElementById("ten_de").innerText = deChon.ten_de;
  document.getElementById("thong_tin_hs").innerText = `${thongTin.hoten} — Lớp ${thongTin.lop}`;
  
  // Vẽ các câu hỏi
  let html = "";
  deChon.cau_hoi.forEach((cau, i)=>{
    html += `<div class="cau"><p><b>Câu ${i+1}:</b> ${cau.q}</p>`;
    cau.a.forEach((ans, j)=>{
      let c = String.fromCharCode(65+j);
      html += `<label class="lua-chon" id="chon-${i+1}-${j}" onclick="chonDapAn(${i+1},${j})">${c}. ${ans}</label>`;
    });
    html += `</div>`;
  });
  document.getElementById("danh_sach_cau").innerHTML = html;
}

function chonDapAn(cau, vt){
  dapAnHS[cau] = vt;
  for(let i=0;i<4;i++) document.getElementById(`chon-${cau}-${i}`)?.classList.remove("chon");
  document.getElementById(`chon-${cau}-${vt}`).classList.add("chon");
}

function nopBai(){
  let d=0, t=deChon.cau_hoi.length, chiTiet="";
  for(let i=0;i<t;i++){
    let cau = deChon.cau_hoi[i], traloi = dapAnHS[i+1];
    let dung = traloi === cau.d;
    if(dung) d++;
    let chon = traloi!==undefined ? String.fromCharCode(65+traloi) : "Chưa chọn";
    let dungsai = String.fromCharCode(65+cau.d);
    chiTiet += `<p style="margin:4px 0">Câu ${i+1}: ${dung?"✅ Đúng":"❌ Sai"} — Bạn ${chon} | Đáp án ${dungsai}</p>`;
  }
  let diem = Math.round((d/t)*10*10)/10;
  let xep = diem>=8?"Xuất sắc":diem>=6.5?"Khá":diem>=5?"Trung bình":"Chưa đạt";
  let mau = diem>=5?"dung":"sai";

  document.getElementById("man-lam").classList.add("an");
  document.getElementById("man-kq").classList.remove("an");
  document.getElementById("noi_dung_kq").innerHTML = `
    <div class="kq ${mau}">
      <h3>🎉 Kết quả bài làm</h3>
      <p><strong>${thongTin.hoten}</strong> — Lớp ${thongTin.lop}</p>
      <p style="font-size:36px;font-weight:bold;margin:10px 0">${diem}/10</p>
      <p style="font-size:18px">${xep}</p>
      <p>Đúng ${d}/${t} câu</p>
      <hr style="margin:15px 0;border:0;border-top:1px solid #ddd">
      ${chiTiet}
    </div>
  `;
}

function lamLai(){
  document.getElementById("man-kq").classList.add("an");
  document.getElementById("man-dau").classList.remove("an");
  document.getElementById("ho_ten").value = "";
  document.getElementById("lop").value = "";
  document.getElementById("ma_de").value = "";
  dapAnHS = {};
}

window.onload = ()=>{
  let m = new URLSearchParams(location.search).get("m");
  if(m) document.getElementById("ma_de").value = m.toUpperCase();
};
</script>
</body>
</html>
