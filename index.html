<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thầy Nhiên Nguyễn Huệ</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
    body{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px}
    .card{background:#fff;border-radius:24px;padding:30px;max-width:520px;margin:20px auto;box-shadow:0 15px 45px rgba(0,0,0,.15)}
    h1{text-align:center;color:#667eea;font-size:24px;margin-bottom:5px}
    .slogan{text-align:center;color:#888;font-style:italic;margin-bottom:20px}
    .an{display:none!important}
    input,textarea{width:100%;padding:12px;border:2px solid #eee;border-radius:10px;font-size:15px;margin:6px 0 12px}
    button{width:100%;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;margin:6px 0}
    button:hover{opacity:.92}
    .btn-tim{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff}
    .btn-xanh{background:#27ae60;color:#fff}
    .btn-cam{background:#f5a623;color:#fff}
    .btn-do{background:#e74c3c;color:#fff}
    .khung{background:#f9f9f9;padding:15px;border-radius:12px;margin:12px 0}
    .de-item{padding:10px;border-bottom:1px solid #eee;cursor:pointer}
    .de-item:hover{background:#f0f4ff}
    .cau{padding:12px;background:#f9f9f9;border-radius:10px;margin:10px 0}
    .lua-chon{display:block;padding:8px;margin:5px 0;border:2px solid #ddd;border-radius:8px;cursor:pointer}
    .lua-chon.chon{border-color:#667eea;background:#eef2ff}
    .kq{margin-top:15px;padding:20px;border-radius:12px;text-align:center}
    .dung{background:#e8f8e8;color:#27ae60}
    .sai{background:#ffe8e8;color:#e74c3c}
    .tab{display:flex;gap:10px;margin-bottom:15px}
    .tab button{flex:1;background:#eee;color:#333}
    .tab button.active{background:#667eea;color:#fff}
    .link-ma{background:#f0f4ff;padding:10px;border-radius:8px;font-family:monospace;word-break:break-all;margin:8px 0}
  </style>
</head>
<body>
<div class="card">
  <h1>📚 Thầy Nhiên Nguyễn Huệ</h1>
  <p class="slogan">"Nỗ lực hôm nay — Thành công ngày mai"</p>

  <!-- CHỌN VAI TRÒ -->
  <div id="man-chon">
    <button class="btn-tim" onclick="moGiaoVien()">👨‍🏫 Giáo viên — Quản lý & Tạo đề</button>
    <p style="text-align:center;margin:15px 0;color:#bbb">——— Hoặc ———</p>
    <button class="btn-xanh" onclick="moHocSinh()">🎓 Học sinh — Làm bài</button>
  </div>

  <!-- ========== GIAO DIỆN GIÁO VIÊN ========== -->
  <div id="man-giaovien" class="an">
    <div class="tab">
      <button id="tab-danhsach" class="active" onclick="tabGiaoVien('danhsach')">📋 Danh sách đề</button>
      <button id="tab-taode" onclick="tabGiaoVien('taode')">✏️ Tạo đề mới</button>
    </div>

    <!-- DANH SÁCH ĐỀ -->
    <div id="giaovien-danhsach">
      <h3>Danh sách đề đã tạo</h3>
      <div id="danhsach-de"></div>
    </div>

    <!-- TẠO ĐỀ MỚI -->
    <div id="giaovien-taode" class="an">
      <h3>Tạo đề kiểm tra mới</h3>
      <input type="text" id="ten-de-moi" placeholder="Tên đề: Kiểm tra giữa kỳ Toán">
      <input type="text" id="ma-de-moi" placeholder="Mã đề: TOAN01 (tự tạo)">
      
      <div id="danhsach-cau-moi">
        <div class="cau">
          <strong>Câu 1</strong>
          <input type="text" class="nd-cau" placeholder="Nội dung câu hỏi">
          <input type="text" class="nd-a" placeholder="Đáp án A">
          <input type="text" class="nd-b" placeholder="Đáp án B">
          <input type="text" class="nd-c" placeholder="Đáp án C">
          <input type="text" class="nd-d" placeholder="Đáp án D">
          <input type="number" class="dung-dung" placeholder="Đáp án đúng: 1=A, 2=B, 3=C, 4=D" min="1" max="4">
        </div>
      </div>
      <button class="btn-cam" onclick="themDongCau()">➕ Thêm câu hỏi</button>
      <button class="btn-xanh" onclick="luuDeMoi()">✅ Lưu đề & Tạo link</button>
      <div id="link-de" class="an khung">
        <p><strong>Chia sẻ cho học sinh:</strong></p>
        <div class="link-ma" id="link-chia-se"></div>
        <button class="btn-tim" onclick="copyLink()">📋 Sao chép link</button>
      </div>
    </div>

    <button class="btn-do" onclick="veDau()" style="margin-top:20px">🔙 Quay lại</button>
  </div>

  <!-- ========== GIAO DIỆN HỌC SINH ========== -->
  <div id="man-hocsinh" class="an">
    <input type="text" id="ho-ten" placeholder="Họ và tên">
    <input type="text" id="lop-hs" placeholder="Lớp">
    <input type="text" id="ma-de-nhap" placeholder="Mã đề" oninput="this.value=this.value.toUpperCase()">
    <button class="btn-tim" onclick="kiemTraDe()">🔍 Bắt đầu làm bài</button>
    <p id="thong-bao-hs" style="margin-top:10px;text-align:center"></p>

    <!-- BÀI LÀM -->
    <div id="phan-bai-lam" class="an">
      <h3 id="ten-de-hs"></h3>
      <p id="thong-tin-hs" style="color:#666;margin-bottom:15px"></p>
      <div id="cac-cau-hoi"></div>
      <button class="btn-cam" onclick="nopBai()">📤 Nộp bài & Xem điểm</button>
    </div>

    <!-- KẾT QUẢ -->
    <div id="phan-ket-qua" class="an">
      <div id="noi-dung-kq"></div>
      <button class="btn-tim" onclick="lamLai()">🔄 Làm bài khác</button>
    </div>

    <button class="btn-do" onclick="veDau()" style="margin-top:20px">🔙 Quay lại</button>
  </div>
</div>

<script>
// ========== DỮ LIỆU — THÊM ĐỀ Ở ĐÂY HOẶC TẠO TỪ GIAO DIỆN ==========
let DANH_SACH_DE = {
  "DEMO": {
    ten: "Đề thử nghiệm",
    cau: [
      {q: "15 + 9 = ?", a:["22","23","24","25"], d:3},
      {q: "Thủ đô Việt Nam?", a:["TP.HCM","Hà Nội","Đà Nẵng","Huế"], d:2}
    ]
  }
};

let deDangChon = null;
let dapAnHS = {};
let thongTinHS = {ten:"", lop:""};
let soCauThem = 1;

// ========== CHUYỂN MÀN HÌNH ==========
function moGiaoVien(){
  document.getElementById("man-chon").classList.add("an");
  document.getElementById("man-giaovien").classList.remove("an");
  hienDanhSachDe();
}
function moHocSinh(){
  document.getElementById("man-chon").classList.add("an");
  document.getElementById("man-hocsinh").classList.remove("an");
}
function veDau(){
  document.getElementById("man-chon").classList.remove("an");
  document.getElementById("man-giaovien").classList.add("an");
  document.getElementById("man-hocsinh").classList.add("an");
  // Reset
  deDangChon = null; dapAnHS = {};
  document.getElementById("phan-bai-lam").classList.add("an");
  document.getElementById("phan-ket-qua").classList.add("an");
  document.getElementById("ho-ten").value = "";
  document.getElementById("lop-hs").value = "";
  document.getElementById("ma-de-nhap").value = "";
}

// ========== GIÁO VIÊN ==========
function tabGiaoVien(tab){
  document.getElementById("giaovien-danhsach").classList.toggle("an", tab!=="danhsach");
  document.getElementById("giaovien-taode").classList.toggle("an", tab!=="taode");
  document.getElementById("tab-danhsach").classList.toggle("active", tab==="danhsach");
  document.getElementById("tab-taode").classList.toggle("active", tab==="taode");
  if(tab==="danhsach") hienDanhSachDe();
}

function hienDanhSachDe(){
  let html = "";
  for(let ma in DANH_SACH_DE){
    html += `<div class="de-item">
      <strong>${ma}</strong> — ${DANH_SACH_DE[ma].ten} (${DANH_SACH_DE[ma].cau.length} câu)
      <br><small>Link: ${location.origin}${location.pathname}?m=${ma}</small>
    </div>`;
  }
  document.getElementById("danhsach-de").innerHTML = html || "<p style='color:#888'>Chưa có đề nào — Tạo đề mới nhé</p>";
}

function themDongCau(){
  soCauThem++;
  const khung = document.getElementById("danhsach-cau-moi");
  const dong = document.createElement("div");
  dong.className = "cau";
  dong.innerHTML = `
    <strong>Câu ${soCauThem}</strong>
    <input type="text" class="nd-cau" placeholder="Nội dung câu hỏi">
    <input type="text" class="nd-a" placeholder="Đáp án A">
    <input type="text" class="nd-b" placeholder="Đáp án B">
    <input type="text" class="nd-c" placeholder="Đáp án C">
    <input type="text" class="nd-d" placeholder="Đáp án D">
    <input type="number" class="dung-dung" placeholder="Đáp án đúng: 1-4" min="1" max="4">
  `;
  khung.appendChild(dong);
}

function luuDeMoi(){
  const ma = document.getElementById("ma-de-moi").value.trim().toUpperCase();
  const ten = document.getElementById("ten-de-moi").value.trim();
  if(!ma || !ten) return alert("Nhập mã đề + tên đề");
  if(DANH_SACH_DE[ma]) return alert("Mã đề đã tồn tại — đổi mã khác");

  const dongCau = document.querySelectorAll("#danhsach-cau-moi .cau");
  const dsCau = [];
  for(let d of dongCau){
    const q = d.querySelector(".nd-cau").value.trim();
    const a = d.querySelector(".nd-a").value.trim();
    const b = d.querySelector(".nd-b").value.trim();
    const c = d.querySelector(".nd-c").value.trim();
    const d_ = d.querySelector(".nd-d").value.trim();
    const dung = parseInt(d.querySelector(".dung-dung").value);
    if(!q || !a || !b || !c || !d_ || isNaN(dung)) return alert("Điền đầy đủ thông tin từng câu");
    dsCau.push({q, a:[a,b,c,d_], d});
  }

  DANH_SACH_DE[ma] = {ten, cau: dsCau};
  const link = `${location.origin}${location.pathname}?m=${ma}`;
  
  document.getElementById("link-de").classList.remove("an");
  document.getElementById("link-chia-se").innerText = link;
  alert(`✅ Đã lưu!\nMã: ${ma}\nLink: ${link}`);
  
  // Reset form
  document.getElementById("ma-de-moi").value = "";
  document.getElementById("ten-de-moi").value = "";
  document.getElementById("danhsach-cau-moi").innerHTML = `
    <div class="cau">
      <strong>Câu 1</strong>
      <input type="text" class="nd-cau" placeholder="Nội dung câu hỏi">
      <input type="text" class="nd-a" placeholder="Đáp án A">
      <input type="text" class="nd-b" placeholder="Đáp án B">
      <input type="text" class="nd-c" placeholder="Đáp án C">
      <input type="text" class="nd-d" placeholder="Đáp án D">
      <input type="number" class="dung-dung" placeholder="Đáp án đúng: 1-4" min="1" max="4">
    </div>
  `;
  soCauThem = 1;
}

function copyLink(){
  const link = document.getElementById("link-chia-se").innerText;
  navigator.clipboard.writeText(link).then(()=>alert("✅ Đã sao chép!"));
}

// ========== HỌC SINH ==========
function kiemTraDe(){
  const ten = document.getElementById("ho-ten").value.trim();
  const lop = document.getElementById("lop-hs").value.trim();
  const ma = document.getElementById("ma-de-nhap").value.trim();
  const tb = document.getElementById("thong-bao-hs");

  if(!ten || !lop) return tb.innerHTML = "<span style='color:red'>⚠️ Nhập họ tên + lớp</span>";
  if(!ma) return tb.innerHTML = "<span style='color:red'>⚠️ Nhập mã đề</span>";
  if(!DANH_SACH_DE[ma]) return tb.innerHTML = "<span style='color:red'>❌ Mã đề không tồn tại</span>";

  thongTinHS = {ten, lop};
  deDangChon = DANH_SACH_DE[ma];
  dapAnHS = {};

  // Vào bài làm
  document.getElementById("phan-bai-lam").classList.remove("an");
  document.getElementById("phan-ket-qua").classList.add("an");
  document.getElementById("ten-de-hs").innerText = deDangChon.ten;
  document.getElementById("thong-tin-hs").innerText = `${ten} — Lớp ${lop}`;
  
  let html = "";
  deDangChon.cau.forEach((cau, i)=>{
    html += `<div class="cau"><p><b>Câu ${i+1}:</b> ${cau.q}</p>`;
    cau.a.forEach((ans, j)=>{
      let c = String.fromCharCode(65+j);
      html += `<label class="lua-chon" id="chon-${i+1}-${j}" onclick="chonDapAn(${i+1},${j})">${c}. ${ans}</label>`;
    });
    html += `</div>`;
  });
  document.getElementById("cac-cau-hoi").innerHTML = html;
  tb.innerHTML = `<span style='color:green'>✅ Đã tìm thấy — bắt đầu làm</span>`;
}

function chonDapAn(cau, vt){
  dapAnHS[cau] = vt;
  for(let i=0;i<4;i++) document.getElementById(`chon-${cau}-${i}`)?.classList.remove("chon");
  document.getElementById(`chon-${cau}-${vt}`).classList.add("chon");
}

function nopBai(){
  if(!deDangChon) return;
  let d=0, t=deDangChon.cau.length, ct="";
  for(let i=0;i<t;i++){
    let cau = deDangChon.cau[i], traloi = dapAnHS[i+1];
    let dung = traloi === cau.d;
    if(dung) d++;
    let chon = traloi!==undefined ? String.fromCharCode(65+traloi) : "Chưa chọn";
    let dungsai = String.fromCharCode(65+cau.d);
    ct += `<p style="margin:4px 0">Câu ${i+1}: ${dung?"✅ Đúng":"❌ Sai"} — Bạn ${chon} | Đáp án ${dungsai}</p>`;
  }
  let diem = Math.round((d/t)*10*10)/10;
  let xep = diem>=8?"Xuất sắc":diem>=6.5?"Khá":diem>=5?"Trung bình":"Chưa đạt";
  let mau = diem>=5?"dung":"sai";

  document.getElementById("phan-bai-lam").classList.add("an");
  document.getElementById("phan-ket-qua").classList.remove("an");
  document.getElementById("noi-dung-kq").innerHTML = `
    <div class="kq ${mau}">
      <h3>🎉 Kết quả</h3>
      <p><strong>${thongTinHS.ten}</strong> — ${thongTinHS.lop}</p>
      <p style="font-size:36px;font-weight:bold;margin:10px 0">${diem}/10</p>
      <p style="font-size:18px">${xep}</p>
      <p>Đúng ${d}/${t} câu</p>
      <hr style="margin:15px 0;border:0;border-top:1px solid #ddd">
      ${ct}
    </div>
  `;
}

function lamLai(){
  document.getElementById("phan-ket-qua").classList.add("an");
  document.getElementById("ma-de-nhap").value = "";
  document.getElementById("thong-bao-hs").innerHTML = "";
  deDangChon = null; dapAnHS = {};
}

// Tự điền mã từ link
window.onload = ()=>{
  let m = new URLSearchParams(location.search).get("m");
  if(m) document.getElementById("ma-de-nhap").value = m.toUpperCase();
};
</script>
</body>
</html>
