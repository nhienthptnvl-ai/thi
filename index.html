<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thầy Nhiên Nguyễn Huệ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
    .card { background: white; border-radius: 24px; padding: 35px; max-width: 460px; margin: 40px auto; box-shadow: 0 15px 45px rgba(0,0,0,0.15); }
    h1 { text-align: center; color: #667eea; font-size: 26px; margin-bottom: 8px; }
    .slogan { text-align: center; color: #888; font-style: italic; margin-bottom: 25px; }
    .trangthai { padding: 14px; border-radius: 12px; margin-bottom: 20px; text-align: center; font-weight: 500; }
    .dang { background: #e6f2ff; color: #0066cc; border-left: 4px solid #0066cc; }
    .tot { background: #e8f8e8; color: #27ae60; border-left: 4px solid #27ae60; }
    .sai { background: #ffe8e8; color: #e74c3c; border-left: 4px solid #e74c3c; }
    input { width: 100%; padding: 14px; border: 2px solid #e8e8e8; border-radius: 12px; font-size: 16px; margin: 8px 0 16px; }
    button { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
    button:hover { opacity: 0.92; }
    .btn-chinh { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; margin-top: 8px; }
    .btn-xanh { background: #27ae60; color: white; margin-top: 10px; }
    .an { display: none !important; }
    .phancach { text-align: center; color: #bbb; margin: 24px 0; }
    .thongbao { margin-top: 12px; }
    .canhbao { color: #f5a623; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📚 Thầy Nhiên Nguyễn Huệ</h1>
    <p class="slogan">"Nỗ lực hôm nay — Thành công ngày mai"</p>

    <div id="trangthai" class="trangthai dang">🔄 Đang khởi tạo...</div>
    <button id="btn-giaovien" class="btn-chinh an" onclick="vaoGiaoVien()">👨‍🏫 Tôi là Giáo viên</button>
    
    <p class="phancach">——— Nhập mã đề để làm bài ———</p>
    <input type="text" id="ma_de" placeholder="VD: DE12345" oninput="this.value=this.value.toUpperCase()">
    <button class="btn-chinh" onclick="kiemTraMa()">🔍 Kiểm tra mã đề</button>
    <div id="thongbao" class="thongbao"></div>
    <button id="vao-lambai" class="btn-xanh an" onclick="vaoLamBai()">✅ Vào làm bài ngay</button>
  </div>

  <script>
    // ========== THÔNG TIN KẾT NỐI ==========
    const SUPABASE_URL = 'https://wdjkafeuiufgtbklada.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_12tANZOMBker_QUzHuWeVQ_eErLAGHm';
    // ========================================

    let supabaseClient = null;
    let deChon = null;

    // === TẢI THƯ VIỆN BẰNG <script> TRỰC TIẾP ===
    async function taiThuVien() {
      const el = document.getElementById('trangthai');
      const nguon = [
        'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1/dist/supabase.min.js',
        'https://unpkg.com/@supabase/supabase-js@2.45.1/dist/umd/supabase.min.js',
        'https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.45.1/supabase.min.js'
      ];
      
      for (const url of nguon) {
        try {
          el.innerHTML = `🔄 Đang tải thư viện...`;
          const script = document.createElement('script');
          script.src = url;
          document.head.appendChild(script);
          
          // Chờ tải xong
          for (let i = 0; i < 50; i++) {
            if (typeof supabase !== 'undefined') return true;
            await new Promise(r => setTimeout(r, 100));
          }
        } catch { continue; }
      }
      return false;
    }

    async function khoiTao() {
      const el = document.getElementById('trangthai');
      
      if (!await taiThuVien()) {
        el.className = 'trangthai sai';
        el.innerHTML = '❌ Không tải được thư viện<br><small>Kiểm tra mạng hoặc tắt chặn quảng cáo</small>';
        return;
      }
      
      el.innerHTML = '🔄 Đang kết nối CSDL...';
      
      try {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
          auth: { persistSession: false }
        });

        const { data, error } = await supabaseClient
          .from('de_kiem_tra')
          .select('ma_de, ten_de')
          .limit(100);

        if (error) throw error;

        el.className = 'trangthai tot';
        el.innerHTML = `✅ Kết nối thành công — ${data.length} đề`;
        document.getElementById('btn-giaovien').classList.remove('an');

        const ma = new URLSearchParams(window.location.search).get('m');
        if (ma) {
          document.getElementById('ma_de').value = ma.toUpperCase();
          kiemTraMa();
        }

      } catch (err) {
        el.className = 'trangthai sai';
        el.innerHTML = `❌ Lỗi: ${err.message}<br>
          <small class="canhbao">
          1. Đã chạy SQL tạo bảng trên Supabase chưa?<br>
          2. URL & KEY đúng chưa?
          </small>`;
      }
    }

    async function kiemTraMa() {
      const ma = document.getElementById('ma_de').value.trim();
      const tb = document.getElementById('thongbao');
      const btn = document.getElementById('vao-lambai');
      tb.innerHTML = ''; btn.classList.add('an'); deChon = null;

      if (!ma) return tb.innerHTML = '<p style="color:#e74c3c">⚠️ Nhập mã đề</p>';
      if (!supabaseClient) return tb.innerHTML = '<p style="color:#e74c3c">❌ Chưa kết nối CSDL</p>';

      const { data, error } = await supabaseClient
        .from('de_kiem_tra')
        .select('*')
        .eq('ma_de', ma)
        .single();

      if (error || !data) {
        tb.innerHTML = `<p style="color:#e74c3c">❌ Mã đề ${ma} không tồn tại</p>`;
        return;
      }

      deChon = data;
      tb.innerHTML = `<p style="color:#27ae60">✅ ${data.ten_de} — ${data.cau_hoi.length} câu</p>`;
      btn.classList.remove('an');
    }

    function vaoLamBai() {
      if (!deChon) return alert('⚠️ Kiểm tra mã đề trước!');
      alert('✅ Đã vào giao diện làm bài — phát triển tiếp');
    }

    function vaoGiaoVien() {
      alert('✅ Giao diện Giáo viên — Tạo đề & Quản lý điểm');
    }

    window.onload = khoiTao;
  </script>
</body>
</html>
