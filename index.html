<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thầy Nhiên Nguyễn Huệ</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
    body{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px}
    .khung{background:#fff;border-radius:24px;padding:35px;max-width:500px;margin:30px auto;box-shadow:0 15px 45px rgba(0,0,0,.15)}
    h1{text-align:center;color:#667eea;font-size:24px;margin-bottom:5px}
    .slogan{text-align:center;color:#888;font-style:italic;margin-bottom:25px}
    .an{display:none!important}
    input{width:100%;padding:14px;border:2px solid #eee;border-radius:12px;font-size:16px;margin:8px 0}
    button{width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;transition:.2s}
    button:hover{opacity:.92}
    .btn-xanh{background:#27ae60;color:#fff;margin-top:10px}
    .btn-tim{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;margin-top:8px}
    .btn-cam{background:#f5a623;color:#fff;margin-top:20px}
    .btn-xam{background:#eee;color:#333;margin-top:10px}
    .cau{padding:18px;background:#f9f9f9;border-radius:14px;margin:15px 0}
    .lua-chon{display:block;padding:12px;margin:8px 0;border:2px solid #ddd;border-radius:10px;cursor:pointer;transition:.2s}
    .lua-chon:hover{border-color:#667eea;background:#f0f4ff}
    .lua-chon.chon{border-color:#667eea;background:#eef2ff}
    .kq{margin-top:20px;padding:25px;border-radius:14px;text-align:center}
    .dung{background:#e8f8e8;color:#27ae60}
    .sai{background:#ffe8e8;color:#e74c3c}
    .tab{display:flex;gap:10px;margin-bottom:20px}
    .tab button{flex:1}
    .tab button.dang{background:#667eea;color:#fff}
    .tab button.bin{background:#eee;color:#333}
  </style>
</head>
<body>
<div class="khung">
  <h1>📚 Thầy Nhiên Nguyễn Huệ</h1>
  <p class="slogan">"Nỗ lực hôm nay — Thành công ngày mai"</p>

  <!-- BƯỚC 1: CHỌN VAI TRÒ -->
  <div id="buoc-chon">
    <button class="btn-tim" onclick="moGiaoVien()">👨‍🏫 Tôi là Giáo viên</button>
    <p style="text-align:center;margin:20px 0;color:#bbb">—————— hoặc ——————</p>
    <button class="btn-xanh" onclick="moHocSinh()">🎓 Tôi là Học sinh</button>
  </div>

  <!-- BƯỚC 2: GIAO DIỆN GIÁO VIÊN -->
  <div id="giao-vien" class="an">
    <div class="tab">
      <button id="tab-ds" class="dang" onclick="chuyenTab('ds')">📋 Danh sách đề</button>
      <button id="tab-tao" class="bin" onclick="chuyenTab('tao')">✏️ Tạo đề mới</button>
    </div>

    <!-- DANH SÁCH ĐỀ -->
    <div id="gv-ds">
      <h3>Danh sách đề đã tạo</h3>
      <div id="danh-sach-de" style="margin-top:15px"></div>
    </div>

    <!-- TẠO ĐỀ MỚI -->
    <div id="gv-tao" class="an">
      <h3>Tạo đề kiểm tra mới</h3>
      <input type="text" id="ten-de-moi" placeholder="Tên đề: Kiểm tra Toán">
      <input type="text" id="ma-de-moi" placeholder="Mã đề: DE001">
      
      <div id="danh-cau-tao">
        <div class="cau">
          <strong>Câu 1</strong>
          <input type="text" class="nd-cau" placeholder="Nội dung câu hỏi">
          <input type="text" class="dap-a" placeholder="Đáp án A">
          <input type="text" class="dap-b" placeholder="Đáp án B">
          <input type="text" class="dap-c" placeholder="Đáp án C">
          <input type="text" class="dap-d" placeholder="Đáp án D">
          <input type="number" class="dung-dung" placeholder="Đáp án đúng: 1=A, 2=B, 3=C, 4=D" min="1" max="4">
        </div>
      </div>
      
      <button class="btn-cam" onclick="themCau()">➕ Thêm câu hỏi</button>
      <button class="btn-xanh" onclick="luuDe()">✅ Lưu đề & Tạo link</button>
      <p id="link-de" style="margin-top:15px;padding:12px;background:#f0f4ff;border-radius:8px;word-break:break-all" class="an"></p>
    </div>

    <button class="btn-xam" onclick="quayLai()">🔙 Quay lại</button>
  </div>

  <!-- BƯỚC 3: GIAO DIỆN HỌC SINH -->
  <div id="hoc-sinh" class="an">
    <input type="text" id="ho-ten-hs" placeholder="Họ và tên của bạn">
    <input type="text" id="lop-hs" placeholder="Lớp">
    <input type="text" id="ma-de-nhap" placeholder="Mã đề (VD: DEMO)" oninput="this.value=this.value.toUpperCase()">
    <button class="btn-tim" onclick="batDauLamBai()">🚀 Bắt đầu làm bài</button>
    <p id="thong-bao" style="margin-top:12px;text-align:center"></p>

    <!-- PHẦN LÀM BÀI -->
    <div id="phan-lam-bai" class="an">
      <h3 id="ten-de-hs"></h3>
      <p id="thong-tin-ca-nhan" style="color:#666;margin-bottom:20px"></p>
      <div id="danh-sach-cau-hoi"></div>
      <button class="btn-cam" onclick="nopBai()">📤 Nộp bài & Xem điểm</button>
    </div>

    <!-- PHẦN KẾT QUẢ -->
    <div id="phan-ket-qua" class="an">
      <div id="noi-dung-ket-qua"></div>
      <button class="btn-tim" onclick="lamBaiKhac()">🔄 Làm bài khác</button>
    </div>

    <button class="btn-xam" onclick="quayLai()">🔙 Quay lại</button>
  </div>
</div>

<script>
// ========== DANH SÁCH ĐỀ MẪU ==========
let DANH_SACH_DE = {
  "DEMO": {
    ten: "Đề thử nghiệm",
    cau: [
      {q: "Câu 1: 15 + 9 bằng bao nhiêu?", a:["22","23","24","25"], d:3},
      {q: "Câu 2: Thủ đô nước Việt Nam là đâu?", a:["TP.Hồ Chí Minh","Hà Nội","Đà Nẵng","Cần Thơ"], d:2}
    ]
  }
};

let DE_DANG_CHON = null;
let DAP_AN_HOC_SINH = {};
let THONG_TIN = {ten:"", lop:""};
let SO_CAU_DA_THEM = 1;

// ========== CHUYỂN MÀN HÌNH ==========
function moGiaoVien(){
  document.getElementById("buoc-chon").classList.add("an");
  document.getElementById("giao-vien").classList.remove("an");
  hienThiDanhSachDe();
}
function moHocSinh(){
  document.getElementById("buoc-chon").classList.add("an");
  document.getElementById("hoc-sinh").classList.remove("an");
}
function quayLai(){
  location.reload();
}
function chuyenTab(tab){
  document.getElementById("gv-ds").classList.toggle("an", tab!=="ds");
  document.getElementById("gv-tao").classList.toggle("an", tab!=="tao");
  document.getElementById("tab-ds").classList.toggle("dang", tab==="ds");
  document.getElementById("tab-ds").classList.toggle("bin", tab!=="ds");
  document.getElementById("tab-tao").classList.toggle("dang", tab==="tao");
  document.getElementById("tab-tao").classList.toggle("bin", tab!=="tao");
  if(tab==="ds") hienThiDanhSachDe();
}

// ========== CHỨC NĂNG GIÁO VIÊN ==========
function hienThiDanhSachDe(){
  let html = "";
  for(let ma in DANH_SACH_DE){
    html += `<div style="padding:12px 0;border-bottom:1px solid #eee">
      <strong>${ma}</strong> — ${DANH_SACH_DE[ma].ten}<br>
      <small style="color:#666">${DANH_SACH_DE[ma].cau.length} câu | Link: ${location.origin}${location.pathname}?m=${ma}</small>
    </div>`;
  }
  document.getElementById("danh-sach-de").innerHTML = html || "<p style='color:#888;text-align:center'>Chưa có đề nào — Tạo đề mới nhé</p>";
}

function themCau(){
  SO_CAU_DA_THEM++;
  const khung = document.getElementById("danh-cau-tao");
  const dongMoi = document.createElement("div");
  dongMoi.className = "cau";
  dongMoi.innerHTML = `
    <strong>Câu ${SO_CAU_DA_THEM}</strong>
    <input type="text" class="nd-cau" placeholder="Nội dung câu hỏi">
    <input type="text" class="dap-a" placeholder="Đáp án A">
    <input type="text" class="dap-b" placeholder="Đáp án B">
    <input type="text" class="dap-c" placeholder="Đáp án C">
    <input type="text" class="dap-d" placeholder="Đáp án D">
    <input type="number" class="dung-dung" placeholder="Đáp án đúng: 1-4" min="1" max="4">
  `;
  khung.appendChild(dongMoi);
}

function luuDe(){
  const ma = document.getElementById("ma-de-moi").value.trim().toUpperCase();
  const ten = document.getElementById("ten-de-moi").value.trim();
  
  if(!ma || !ten) return alert("⚠️ Nhập mã đề và tên đề");
  if(DANH_SACH_DE[ma]) return alert("❌ Mã đề đã tồn tại — chọn mã khác");
  
  const dsCau = [];
  document.querySelectorAll("#danh-cau-tao .cau").forEach(dong => {
    const q = dong.querySelector(".nd-cau").value.trim();
    const a = dong.querySelector(".dap-a").value.trim();
    const b = dong.querySelector(".dap-b").value.trim();
    const c = dong.querySelector(".dap-c").value.trim();
    const d = dong.querySelector(".dap-d").value.trim();
    const dung = parseInt(dong.querySelector(".dung-dung").value);
    
    if(q && a && b && c && d && !isNaN(dung)){
      dsCau.push({q, a:[a,b,c,d], d:dung});
    }
  });
  
  if(dsCau.length === 0) return alert("⚠️ Điền đầy đủ thông tin ít nhất 1 câu hỏi");
  
  DANH_SACH_DE[ma] = {ten, cau: dsCau};
  const linkChiaSe = `${location.origin}${location.pathname}?m=${ma}`;
  
  document.getElementById("link-de").classList.remove("an");
  document.getElementById("link-de").innerHTML = `
    ✅ <strong>Đã lưu đề!</strong><br>
    Mã: ${ma}<br>
    Link: ${linkChiaSe}<br>
    <button class="btn-tim" style="margin-top:8px" onclick="navigator.clipboard.writeText('${linkChiaSe}').then(()=>alert('✅ Đã sao chép!'))">📋 Sao chép link</button>
  `;
  
  // Reset form
  document.getElementById("ma-de-moi").value = "";
  document.getElementById("ten-de-moi").value = "";
  document.getElementById("danh-cau-tao").innerHTML = `
    <div class="cau">
      <strong>Câu 1</strong>
      <input type="text" class="nd-cau" placeholder="Nội dung câu hỏi">
      <input type="text" class="dap-a" placeholder="Đáp án A">
      <input type="text" class="dap-b" placeholder="Đáp án B">
      <input type="text" class="dap-c" placeholder="Đáp án C">
      <input type="text" class="dap-d" placeholder="Đáp án D">
      <input type="number" class="dung-dung" placeholder="Đáp án đúng: 1-4" min="1" max="4">
    </div>
  `;
  SO_CAU_DA_THEM = 1;
}

// ========== CHỨC NĂNG HỌC SINH ==========
function batDauLamBai(){
  const ten = document.getElementById("ho-ten-hs").value.trim();
  const lop = document.getElementById("lop-hs").value.trim();
  const ma = document.getElementById("ma-de-nhap").value.trim();
  const tb = document.getElementById("thong-bao");
  
  if(!ten || !lop) return tb.innerHTML = "<span style='color:red'>⚠️ Nhập họ tên và lớp</span>";
  if(!ma) return tb.innerHTML = "<span style='color:red'>⚠️ Nhập mã đề</span>";
  if(!DANH_SACH_DE[ma]) return tb.innerHTML = "<span style='color:red'>❌ Mã đề không tồn tại<br>💡 Thử gõ: DEMO</span>";
  
  THONG_TIN = {ten, lop};
  DE_DANG_CHON = DANH_SACH_DE[ma];
  DAP_AN_HOC_SINH = {};
  
  // Hiện bài làm
  document.getElementById("phan-lam-bai").classList.remove("an");
  document.getElementById("phan-ket-qua").classList.add("an");
  document.getElementById("ten-de-hs").innerText = DE_DANG_CHON.ten;
  document.getElementById("thong-tin-ca-nhan").innerText = `${ten} — Lớp ${lop}`;
  
  let html = "";
  DE_DANG_CHON.cau.forEach((cau, viTri) => {
    html += `<div class="cau"><p><b>Câu ${viTri+1}:</b> ${cau.q}</p>`;
    cau.a.forEach((dapAn, stt) => {
      let chuCai = String.fromCharCode(65 + stt);
      html += `<label class="lua-chon" id="chon-${viTri+1}-${stt}" onclick="chonDapAn(${viTri+1},${stt})">${chuCai}. ${dapAn}</label>`;
    });
    html += `</div>`;
  });
  document.getElementById("danh-sach-cau-hoi").innerHTML = html;
  tb.innerHTML = "<span style='color:green'>✅ Đã tìm thấy đề — Bắt đầu làm bài!</span>";
}

function chonDapAn(soCau, viTriDapAn){
  DAP_AN_HOC_SINH[soCau] = viTriDapAn;
  // Xóa chọn cũ
  for(let i = 0; i < 4; i++){
    document.getElementById(`chon-${soCau}-${i}`)?.classList.remove("chon");
  }
  // Đánh dấu chọn mới
  document.getElementById(`chon-${soCau}-${viTriDapAn}`).classList.add("chon");
}

function nopBai(){
  if(!DE_DANG_CHON) return;
  
  let dung = 0;
  let tong = DE_DANG_CHON.cau.length;
  let chiTiet = "";
  
  for(let i = 0; i < tong; i++){
    let cau = DE_DANG_CHON.cau[i];
    let cauSo = i + 1;
    let traLoi = DAP_AN_HOC_SINH[cauSo];
    let dungCau = traLoi === cau.d;
    
    if(dungCau) dung++;
    let chon = traLoi !== undefined ? String.fromCharCode(65 + traLoi) : "Chưa chọn";
    let dapAnDung = String.fromCharCode(65 + cau.d);
    
    chiTiet += `<p style="margin:6px 0">
      Câu ${cauSo}: ${dungCau ? '✅ Đúng' : '❌ Sai'} — Bạn chọn ${chon} | Đáp án đúng: ${dapAnDung}
    </p>`;
  }
  
  let diem = Math.round((dung / tong) * 10 * 10) / 10;
  let xepLoai = diem >= 8 ? "Xuất sắc" : diem >= 6.5 ? "Khá" : diem >= 5 ? "Trung bình" : "Chưa đạt";
  let mauNen = diem >= 5 ? "dung" : "sai";
  
  // Hiện kết quả
  document.getElementById("phan-lam-bai").classList.add("an");
  document.getElementById("phan-ket-qua").classList.remove("an");
  document.getElementById("noi-dung-ket-qua").innerHTML = `
    <div class="kq ${mauNen}">
      <h3>🎉 Kết quả bài làm</h3>
      <p style="margin:8px 0"><strong>${THONG_TIN.ten}</strong> — Lớp ${THONG_TIN.lop}</p>
      <p style="font-size:40px;font-weight:bold;margin:15px 0">${diem}/10</p>
      <p style="font-size:20px">${xepLoai}</p>
      <p>Đúng ${dung}/${tong} câu</p>
      <hr style="margin:20px 0;border:0;border-top:1px solid #ddd">
      ${chiTiet}
    </div>
  `;
}

function lamBaiKhac(){
  document.getElementById("phan-ket-qua").classList.add("an");
  document.getElementById("ma-de-nhap").value = "";
  document.getElementById("thong-bao").innerHTML = "";
  DE_DANG_CHON = null;
  DAP_AN_HOC_SINH = {};
}

// Tự động điền mã đề từ link ?m=DEMO
window.onload = function(){
  let maTuLink = new URLSearchParams(location.search).get("m");
  if(maTuLink) document.getElementById("ma-de-nhap").value = maTuLink.toUpperCase();
};
</script>
</body>
</html>
